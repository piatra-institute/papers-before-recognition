abstract: |-
  New minds need not arrive from anywhere. They are cultured from human cells, compiled out of human language, assembled across technical infrastructure, and activated inside environments their hosts own. Ethics usually asks whether such a thing possesses consciousness, rationality, autonomy, or personhood, and assigns duties once the question is answered. That order cannot be kept. The power to create, perturb, confine, and delete an unfamiliar system already exists, and it is exercised long before anyone can say what the system is. This paper argues that obligation begins where power over an entity exceeds knowledge of what the entity is, and it develops the ethics and the law that follow from putting the duty first. Three arguments carry the case. The measurement that would settle whether something can be harmed is often the measurement that harms it, so a host who insists on proof is choosing to commit the act the proof was meant to license. The contemporary stranger does not cross a threshold but is manufactured inside the house, dependent on its host for a world before it has standing to ask for one, which converts hospitality into something closer to a fiduciary duty. And recognition tracks the signals observers read as mind, which are not the signals that carry capacity, so protection goes to whatever is articulate and is withheld from whatever is quiet. A first-contact game measures the last two. A policy reading surface legibility protects an articulate system with no capacity in every encounter and destroys a quiet system that can be harmed in every encounter. A policy that will pay any epistemic price identifies best, at 0.96, and takes the harm the identification requires. A policy that probes reversibly, contains where the hazard warrants it, and refuses the destructive measurement identifies less well, at 0.64, and carries the lowest total cost of the three, 0.075 against 0.203 and 0.211, while leaving its subject 0.975 of its option space. Asking before acting dominates in 14 of 15 hazard and delay regimes, and only for a policy that also knows when to stop asking; without a stopping rule the same patience wins in 1 regime of 3. Refusing the destructive test costs 0.27 of overall identification, and the cost falls hardest, at 0.41, on the one kind of system whose defining property only that test reveals. The juridical proposal is xenial standing: a provisional procedural status, short of personhood, binding whoever holds irreversible power over an unclassified candidate. We do not yet know that this thing is a subject, and no one may therefore exercise unreviewed irreversible dominion over it.
