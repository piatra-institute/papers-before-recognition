- id: birch-precaution
  kind: source
  passage: 'Precautionary approaches to uncertain sentience are the closest available framework and the right starting
    point: Birch argues that a realistic possibility of sentience should govern practice instead of being set aside
    until proof arrives, and builds a framework for acting under that uncertainty [@birch2017; @birch2024].'
  evidence:
    citation_id: birch2017
    locator: Abstract
    verified: true
    verification_note: 'Crossref abstract of DOI 10.51291/2377-7478.1200: a precautionary principle for animal sentience
      with a practical framework for inconclusive evidence; the 2024 book''s OUP abstract (10.1093/9780191966729.001.0001)
      presents a comprehensive precautionary framework under sentience uncertainty.'
- id: levin-tame
  kind: source
  passage: Levin's programme argues for a graded, substrate-neutral investigation of goal-directedness across biological
    scales, on the grounds that the machinery of pursuing and restoring target states is not restricted to nervous
    systems [@levin2022].
  evidence:
    citation_id: levin2022
    locator: Abstract
    verified: true
    verification_note: 'Crossref abstract of DOI 10.3389/fnsys.2022.768201: TAME, a non-binary, empirically based
      framework for cognition in unconventional substrates, morphogenesis as basal cognition.'
- id: anthrobots
  kind: source
  passage: Cells taken from one organism and released from their usual anatomical context reassemble into motile
    forms with no evolutionary precedent and coordinate in ways the donor body never performed [@kriegman2020],
    and the same has since been done with adult human somatic cells [@gumuskaya2023].
  evidence:
    citation_id: gumuskaya2023
    locator: Abstract
    verified: true
    verification_note: 'Crossref abstract of DOI 10.1002/advs.202303575: single adult human lung cells self-construct
      into motile multicellular biobots. The Xenobot part of the sentence (kriegman2020) was checked only against
      its abstract, which describes a design-and-construction pipeline for novel lifeforms.'
- id: organoid-ethics
  kind: source
  passage: 'Brain organoids raise the patiency question most directly, and the ethical literature on them has been
    careful: increasing complexity, sensory coupling, and learning capacity might produce morally relevant states,
    current evidence is insufficient to say, and the insufficiency is not a reason to proceed as though the answer
    were no [@lavazza2018; @kreitmair2023].'
  evidence:
    citation_id: lavazza2018
    locator: Abstract
    verified: true
    verification_note: 'Crossref abstract of DOI 10.1136/medethics-2017-104555: cerebral organoids show neural connections
      and electrical activity, raising whether they are or will be somewhat sentient; measurement techniques proposed.
      Kreitmair (10.1017/s0963180123000063) abstract addresses consciousness degrees and research protections.'
- id: kurki-bundle
  kind: source
  passage: Legal personhood is a legal construct and not a scientific finding, and the literature is clear that
    personhood is better understood as a bundle of separable legal positions than as a single status an entity has
    or lacks [@kurki2019].
  evidence:
    citation_id: kurki2019
